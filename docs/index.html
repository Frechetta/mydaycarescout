<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MyDaycareScout</title>
  <meta
    name="description"
    content="MyDaycareScout is making it easier for parents to find the right daycare for their family."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;

      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;

      color: #24352f;
      background:
        radial-gradient(circle at 20% 20%, #f3ead7 0, transparent 35%),
        radial-gradient(circle at 80% 80%, #dcebe4 0, transparent 35%),
        #faf8f3;
    }

    main {
      width: 100%;
      max-width: 680px;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 3rem;

      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo-mark {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 2.25rem;
      height: 2.25rem;

      color: #fff;
      background: #477c68;
      border-radius: 50%;

      font-family: Georgia, serif;
      font-size: 1.15rem;
      font-weight: bold;
    }

    h1 {
      margin: 0;

      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 9vw, 5.5rem);
      font-weight: 500;
      line-height: 1.00;
      letter-spacing: -0.055em;

      color: #24352f;
    }

    .accent {
      color: #477c68;
    }

    p {
      max-width: 520px;
      margin: 1.75rem auto 0;

      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;

      color: #68756f;
    }

    .coming-soon {
      display: inline-block;
      margin-top: 2.5rem;
      padding: 0.6rem 1rem;

      border: 1px solid #d5ddd8;
      border-radius: 999px;

      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;

      color: #477c68;
      background: rgba(255, 255, 255, 0.5);
    }

    footer {
      margin-top: 5rem;
      font-size: 0.8rem;
      color: #9aa39f;
    }
  </style>
</head>

<body>
  <main>
    <div class="logo">
      <span>MyDaycareScout&trade;</span>
    </div>

    <h1>
      Finding a daycare<br>
      <span class="accent">should be easier.</span>
    </h1>

    <p>
      MyDaycareScout&trade; is building a simpler way for parents to discover
      and compare childcare options for their family.
    </p>

    <div class="coming-soon">Coming Soon</div>

    <footer>
      &copy; 2026 MyDaycareScout&trade;
    </footer>
  </main>
</body>
</html>
